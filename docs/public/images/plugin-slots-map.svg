<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <pattern id="slotDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#dce1ea"/>
    </pattern>
    <filter id="slotShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="18" fill="#fafafc" stroke="#e4e7ec"/>
  <rect width="920" height="420" rx="18" fill="url(#slotDots)"/>

  <!-- Center Core Kernel Box -->
  <g filter="url(#slotShadow)">
    <rect x="240" y="112" width="440" height="196" rx="16" fill="#ffffff" stroke="#d0d7e2" stroke-dasharray="5 4"/>
  </g>
  <rect x="392" y="130" width="136" height="24" rx="8" fill="rgba(37,99,235,0.10)"/>
  <text x="460" y="146" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="650">Clado 本体（微内核）</text>
  <text x="460" y="176" text-anchor="middle" fill="#18181b" font-size="14" font-weight="700">无限画布运行时 · 三视图渲染 · 纯文本解析与 MCP 网关</text>
  <text x="460" y="200" text-anchor="middle" fill="#52525b" font-size="12">即使关闭全部可选界面插件，本体仍独立承载画布渲染、</text>
  <text x="460" y="218" text-anchor="middle" fill="#52525b" font-size="12">Tag 连线、平移缩放、放大镜 Lens、多子工作区原子写盘与 SSE 推送</text>
  <rect x="274" y="242" width="114" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="331" y="264" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">Core Parser</text>
  <rect x="403" y="242" width="114" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="264" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">Canvas Host</text>
  <rect x="532" y="242" width="114" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="589" y="264" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">MCP Gateway</text>

  <!-- Top-Left: clado.brand -->
  <g filter="url(#slotShadow)">
    <rect x="28" y="26" width="232" height="72" rx="14" fill="rgba(255,255,255,0.92)" stroke="#e2e8f0"/>
  </g>
  <rect x="42" y="42" width="28" height="28" rx="8" fill="#1c2028"/>
  <text x="56" y="61" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>
  <text x="80" y="54" fill="#18181b" font-size="13" font-weight="700">clado.brand</text>
  <text x="80" y="72" fill="#71717a" font-size="11">top-left · 主题 / 截图 / 插件管理</text>
  <text x="42" y="88" fill="#2563eb" font-size="10.5">常驻管理入口（不可关闭）</text>

  <!-- Top-Right: clado.view-controls -->
  <g filter="url(#slotShadow)">
    <rect x="660" y="26" width="232" height="72" rx="14" fill="rgba(255,255,255,0.92)" stroke="#e2e8f0"/>
  </g>
  <text x="676" y="50" fill="#18181b" font-size="13" font-weight="700">clado.view-controls</text>
  <text x="676" y="68" fill="#71717a" font-size="11">top-right · 卡片 / 脑图 / 文档</text>
  <text x="676" y="86" fill="#047857" font-size="10.5">诊断问题角标 · 退出聚焦</text>

  <!-- Bottom-Left: clado.directory -->
  <g filter="url(#slotShadow)">
    <rect x="28" y="322" width="232" height="72" rx="14" fill="rgba(255,255,255,0.92)" stroke="#e2e8f0"/>
  </g>
  <text x="44" y="346" fill="#18181b" font-size="13" font-weight="700">clado.directory</text>
  <text x="44" y="364" fill="#71717a" font-size="11">bottom-left · 文档树 / 搜索 / 源码</text>
  <text x="44" y="382" fill="#6d28d9" font-size="10.5">多子工作区切换 · MCP directory.open@1</text>

  <!-- Bottom-Right: clado.agent -->
  <g filter="url(#slotShadow)">
    <rect x="660" y="322" width="232" height="72" rx="14" fill="rgba(255,255,255,0.92)" stroke="#e2e8f0"/>
  </g>
  <text x="676" y="346" fill="#18181b" font-size="13" font-weight="700">clado.agent</text>
  <text x="676" y="364" fill="#71717a" font-size="11">bottom-right · 灵感垂直 Agent</text>
  <text x="676" y="382" fill="#b45309" font-size="10.5">流式对话 · ask_user 拍板 · ACP 派单</text>
</svg>
