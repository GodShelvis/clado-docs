<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardElev" x="-14%" y="-14%" width="128%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="glassElev" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="auraBlur" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hairlineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="78%" stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfcfd"/>
    </linearGradient>
  </defs>

  <!-- Subtle dot matrix backdrop (fades softly toward edges) -->
  <g opacity="0.55">
    <circle cx="84" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="124" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="164" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="204" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="244" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="284" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="324" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="364" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="404" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="444" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="484" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="524" cy="70" r="1.4" fill="#cbd5e1"/><circle cx="564" cy="70" r="1.4" fill="#cbd5e1"/>
    <circle cx="84" cy="110" r="1.4" fill="#cbd5e1"/><circle cx="564" cy="110" r="1.4" fill="#cbd5e1"/>
    <circle cx="84" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="124" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="164" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="204" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="244" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="284" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="324" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="364" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="404" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="444" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="484" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="524" cy="410" r="1.4" fill="#cbd5e1"/><circle cx="564" cy="410" r="1.4" fill="#cbd5e1"/>
  </g>

  <!-- Floating Glass Pill (top-right conceptual view switcher) -->
  <g filter="url(#glassElev)">
    <rect x="404" y="24" width="186" height="36" rx="12" fill="rgba(255,255,255,0.78)" stroke="rgba(15,23,42,0.09)"/>
    <rect x="408" y="28" width="58" height="28" rx="9" fill="#ffffff" stroke="rgba(15,23,42,0.08)"/>
    <text x="437" y="46" text-anchor="middle" fill="#18181b" font-size="12" font-weight="650">卡片</text>
    <text x="497" y="46" text-anchor="middle" fill="#71717a" font-size="12">脑图</text>
    <text x="557" y="46" text-anchor="middle" fill="#71717a" font-size="12">文档</text>
  </g>

  <!-- Curved Bezier Wires connecting Left Card -> Right Top & Bottom Cards -->
  <path d="M 272 184 C 316 184, 316 168, 354 168" stroke="url(#wireGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 272 232 C 316 232, 316 332, 354 332" stroke="url(#wireGrad)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left Card: Source Card (Clean monochrome + pastel semantic pills) -->
  <g filter="url(#cardElev)">
    <rect x="28" y="96" width="244" height="234" rx="16" fill="url(#cardSurface)" stroke="rgba(15,23,42,0.09)"/>
  </g>
  <line x1="28" y1="122" x2="272" y2="122" stroke="rgba(15,23,42,0.06)"/>
  <circle cx="44" cy="109" r="2" fill="#cbd5e1"/><circle cx="52" cy="109" r="2" fill="#cbd5e1"/>
  <rect x="26" y="138" width="4" height="22" rx="2" fill="#2563eb"/>
  <text x="44" y="154" fill="#18181b" font-size="16" font-weight="700">订单入口</text>

  <!-- Row 1: Blue Spec Pill -->
  <rect x="44" y="172" width="42" height="22" rx="6" fill="rgba(59,130,246,0.12)"/>
  <text x="65" y="187" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">契约</text>
  <rect x="94" y="179" width="120" height="8" rx="4" fill="#e4e7ec"/>
  <line x1="94" y1="191" x2="178" y2="191" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
  <rect x="269" y="174" width="4.5" height="20" rx="2.25" fill="#2563eb"/>

  <!-- Row 2: Green Added Pill -->
  <rect x="44" y="220" width="42" height="22" rx="6" fill="rgba(16,185,129,0.12)"/>
  <text x="65" y="235" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">新增</text>
  <rect x="94" y="227" width="136" height="8" rx="4" fill="#e4e7ec"/>
  <line x1="94" y1="239" x2="188" y2="239" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
  <rect x="269" y="222" width="4.5" height="20" rx="2.25" fill="#2563eb"/>

  <!-- Row 3: Purple Note Pill -->
  <rect x="44" y="268" width="42" height="22" rx="6" fill="rgba(139,92,246,0.12)"/>
  <text x="65" y="283" text-anchor="middle" fill="#6d28d9" font-size="11" font-weight="600">说明</text>
  <rect x="94" y="275" width="104" height="8" rx="4" fill="#eef0f4"/>

  <!-- Active AI Bottom >=80% Silk Feathered Glow under Right-Top Card -->
  <g filter="url(#auraBlur)" opacity="0.72">
    <ellipse cx="426" cy="240" rx="64" ry="14" fill="#38bdf8" fill-opacity="0.46"/>
    <ellipse cx="484" cy="242" rx="62" ry="16" fill="#8b5cf6" fill-opacity="0.46"/>
    <ellipse cx="542" cy="240" rx="58" ry="13" fill="#f472b6" fill-opacity="0.38"/>
  </g>

  <!-- Right Top Card: Active AI Card with Code Left-Gutter Tag & >=80% Bottom Aura -->
  <g filter="url(#cardElev)">
    <rect x="354" y="84" width="258" height="154" rx="16" fill="url(#cardSurface)" stroke="rgba(15,23,42,0.09)"/>
  </g>
  <rect x="372" y="237.2" width="222" height="1.5" rx="0.75" fill="url(#hairlineGlow)"/>
  <line x1="354" y1="110" x2="612" y2="110" stroke="rgba(15,23,42,0.06)"/>
  <circle cx="370" cy="97" r="2" fill="#cbd5e1"/><circle cx="378" cy="97" r="2" fill="#cbd5e1"/>
  <circle cx="536" cy="97" r="3" fill="#6366f1"/>
  <text x="545" y="101" fill="#71717a" font-size="10.5" font-weight="500">AI 处理中</text>

  <text x="372" y="136" fill="#18181b" font-size="15.5" font-weight="700">支付网关</text>

  <!-- Mini Code Block with Left-Gutter Tag -->
  <rect x="372" y="148" width="222" height="72" rx="10" fill="#f8fafc" stroke="rgba(15,23,42,0.07)"/>
  <circle cx="386" cy="168" r="3.2" fill="#3b82f6"/>
  <rect x="378" y="186" width="32" height="17" rx="5" fill="rgba(16,185,129,0.14)"/>
  <text x="394" y="198" text-anchor="middle" fill="#047857" font-size="10" font-weight="600">落账</text>
  <text x="418" y="172" fill="#18181b" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">verifySign(req);</text>
  <text x="418" y="198" fill="#52525b" font-family="ui-monospace, Menlo, monospace" font-size="11.5">ledger.commit(req);</text>

  <!-- Incoming Anchor Bar + Dashed Stem to Blue Dot -->
  <rect x="352" y="158" width="4.5" height="20" rx="2.25" fill="#2563eb"/>
  <line x1="357" y1="168" x2="379" y2="168" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Right Bottom Card: Pure 5.5px Zero-Ring Dot List -->
  <g filter="url(#cardElev)">
    <rect x="354" y="274" width="258" height="122" rx="16" fill="url(#cardSurface)" stroke="rgba(15,23,42,0.09)"/>
  </g>
  <text x="374" y="304" fill="#18181b" font-size="15" font-weight="700">账务清算</text>
  <circle cx="378" cy="332" r="3.2" fill="#10b981"/>
  <rect x="392" y="328" width="166" height="8" rx="4" fill="#d4d8e1"/>
  <circle cx="378" cy="356" r="3.2" fill="#f59e0b"/>
  <rect x="392" y="352" width="132" height="8" rx="4" fill="#e4e7ec"/>
  <circle cx="378" cy="378" r="3.2" fill="#8b5cf6"/>
  <rect x="392" y="374" width="146" height="8" rx="4" fill="#eef0f4"/>
  <!-- Incoming Anchor Bar + Dashed Stem to Green Dot -->
  <rect x="352" y="322" width="4.5" height="20" rx="2.25" fill="#2563eb"/>
  <line x1="357" y1="332" x2="372" y2="332" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Floating Bottom-Right Glass Agent Pill -->
  <g filter="url(#glassElev)">
    <rect x="492" y="420" width="112" height="38" rx="13" fill="rgba(255,255,255,0.82)" stroke="rgba(15,23,42,0.09)"/>
    <circle cx="518" cy="439" r="3.5" fill="#6366f1"/>
    <text x="558" y="444" text-anchor="middle" fill="#18181b" font-size="13" font-weight="600">灵感 AI</text>
  </g>
</svg>
