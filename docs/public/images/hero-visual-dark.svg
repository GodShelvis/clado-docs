<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardElevD" x="-14%" y="-14%" width="128%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="glassElevD" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="auraBlurD" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="wireGradD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hairlineGlowD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#e879f9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Subtle dark dot matrix -->
  <g opacity="0.45">
    <circle cx="84" cy="70" r="1.4" fill="#334155"/><circle cx="124" cy="70" r="1.4" fill="#334155"/><circle cx="164" cy="70" r="1.4" fill="#334155"/><circle cx="204" cy="70" r="1.4" fill="#334155"/><circle cx="244" cy="70" r="1.4" fill="#334155"/><circle cx="284" cy="70" r="1.4" fill="#334155"/><circle cx="324" cy="70" r="1.4" fill="#334155"/><circle cx="364" cy="70" r="1.4" fill="#334155"/><circle cx="404" cy="70" r="1.4" fill="#334155"/><circle cx="444" cy="70" r="1.4" fill="#334155"/><circle cx="484" cy="70" r="1.4" fill="#334155"/><circle cx="524" cy="70" r="1.4" fill="#334155"/><circle cx="564" cy="70" r="1.4" fill="#334155"/>
    <circle cx="84" cy="410" r="1.4" fill="#334155"/><circle cx="164" cy="410" r="1.4" fill="#334155"/><circle cx="244" cy="410" r="1.4" fill="#334155"/><circle cx="324" cy="410" r="1.4" fill="#334155"/><circle cx="404" cy="410" r="1.4" fill="#334155"/><circle cx="484" cy="410" r="1.4" fill="#334155"/><circle cx="564" cy="410" r="1.4" fill="#334155"/>
  </g>

  <!-- Floating Glass View Switcher -->
  <g filter="url(#glassElevD)">
    <rect x="404" y="24" width="186" height="36" rx="12" fill="rgba(24,29,38,0.78)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="408" y="28" width="58" height="28" rx="9" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.14)"/>
    <text x="437" y="46" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="650">卡片</text>
    <text x="497" y="46" text-anchor="middle" fill="#94a3b8" font-size="12">脑图</text>
    <text x="557" y="46" text-anchor="middle" fill="#94a3b8" font-size="12">文档</text>
  </g>

  <!-- Wires -->
  <path d="M 272 184 C 316 184, 316 168, 354 168" stroke="url(#wireGradD)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 272 232 C 316 232, 316 332, 354 332" stroke="url(#wireGradD)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left Card -->
  <g filter="url(#cardElevD)">
    <rect x="28" y="96" width="244" height="234" rx="16" fill="#161b22" stroke="rgba(255,255,255,0.1)"/>
  </g>
  <line x1="28" y1="122" x2="272" y2="122" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="44" cy="109" r="2" fill="#475569"/><circle cx="52" cy="109" r="2" fill="#475569"/>
  <rect x="26" y="138" width="4" height="22" rx="2" fill="#60a5fa"/>
  <text x="44" y="154" fill="#f1f5f9" font-size="16" font-weight="700">订单入口</text>

  <rect x="44" y="172" width="42" height="22" rx="6" fill="rgba(59,130,246,0.2)"/>
  <text x="65" y="187" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">契约</text>
  <rect x="94" y="179" width="120" height="8" rx="4" fill="#27303d"/>
  <line x1="94" y1="191" x2="178" y2="191" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.65"/>
  <rect x="269" y="174" width="4.5" height="20" rx="2.25" fill="#60a5fa"/>

  <rect x="44" y="220" width="42" height="22" rx="6" fill="rgba(16,185,129,0.2)"/>
  <text x="65" y="235" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">新增</text>
  <rect x="94" y="227" width="136" height="8" rx="4" fill="#27303d"/>
  <line x1="94" y1="239" x2="188" y2="239" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.65"/>
  <rect x="269" y="222" width="4.5" height="20" rx="2.25" fill="#60a5fa"/>

  <rect x="44" y="268" width="42" height="22" rx="6" fill="rgba(139,92,246,0.2)"/>
  <text x="65" y="283" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">说明</text>
  <rect x="94" y="275" width="104" height="8" rx="4" fill="#212936"/>

  <!-- Active AI Bottom >=80% Silk Feathered Glow -->
  <g filter="url(#auraBlurD)" opacity="0.88">
    <ellipse cx="426" cy="240" rx="64" ry="15" fill="#38bdf8" fill-opacity="0.52"/>
    <ellipse cx="484" cy="242" rx="62" ry="17" fill="#a78bfa" fill-opacity="0.52"/>
    <ellipse cx="542" cy="240" rx="58" ry="14" fill="#f472b6" fill-opacity="0.42"/>
  </g>

  <!-- Right Top Card -->
  <g filter="url(#cardElevD)">
    <rect x="354" y="84" width="258" height="154" rx="16" fill="#161b22" stroke="rgba(255,255,255,0.1)"/>
  </g>
  <rect x="372" y="237.2" width="222" height="1.5" rx="0.75" fill="url(#hairlineGlowD)"/>
  <line x1="354" y1="110" x2="612" y2="110" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="97" r="2" fill="#475569"/><circle cx="378" cy="97" r="2" fill="#475569"/>
  <circle cx="536" cy="97" r="3" fill="#818cf8"/>
  <text x="545" y="101" fill="#94a3b8" font-size="10.5" font-weight="500">AI 处理中</text>

  <text x="372" y="136" fill="#f1f5f9" font-size="15.5" font-weight="700">支付网关</text>

  <rect x="372" y="148" width="222" height="72" rx="10" fill="#0f1217" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="386" cy="168" r="3.2" fill="#60a5fa"/>
  <rect x="378" y="186" width="32" height="17" rx="5" fill="rgba(16,185,129,0.22)"/>
  <text x="394" y="198" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">落账</text>
  <text x="418" y="172" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">verifySign(req);</text>
  <text x="418" y="198" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">ledger.commit(req);</text>

  <rect x="352" y="158" width="4.5" height="20" rx="2.25" fill="#60a5fa"/>
  <line x1="357" y1="168" x2="379" y2="168" stroke="#60a5fa" stroke-width="1.3" stroke-dasharray="3 3" stroke-opacity="0.65"/>

  <!-- Right Bottom Card -->
  <g filter="url(#cardElevD)">
    <rect x="354" y="274" width="258" height="122" rx="16" fill="#161b22" stroke="rgba(255,255,255,0.1)"/>
  </g>
  <text x="374" y="304" fill="#f1f5f9" font-size="15" font-weight="700">账务清算</text>
  <circle cx="378" cy="332" r="3.2" fill="#34d399"/>
  <rect x="392" y="328" width="166" height="8" rx="4" fill="#334155"/>
  <circle cx="378" cy="356" r="3.2" fill="#fbbf24"/>
  <rect x="392" y="352" width="132" height="8" rx="4" fill="#27303d"/>
  <circle cx="378" cy="378" r="3.2" fill="#a78bfa"/>
  <rect x="392" y="374" width="146" height="8" rx="4" fill="#1f2733"/>
  <rect x="352" y="322" width="4.5" height="20" rx="2.25" fill="#60a5fa"/>
  <line x1="357" y1="332" x2="372" y2="332" stroke="#60a5fa" stroke-width="1.3" stroke-dasharray="3 3" stroke-opacity="0.65"/>

  <!-- Floating Bottom-Right Glass Agent Pill -->
  <g filter="url(#glassElevD)">
    <rect x="492" y="420" width="112" height="38" rx="13" fill="rgba(24,29,38,0.84)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="518" cy="439" r="3.5" fill="#818cf8"/>
    <text x="558" y="444" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">灵感 AI</text>
  </g>
</svg>
